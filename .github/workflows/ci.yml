name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # 9.0.x builds the Client/Models/Tests projects (pinned via the repo
          # root global.json); 10.0.x builds the example CLI (example/Integrity-cli
          # targets net10.0 and is pinned by example/global.json).
          dotnet-version: |
            9.0.x
            10.0.x

      # coverlet.console is a local tool (.config/dotnet-tools.json); it collects
      # coverage over the Microsoft.Testing.Platform test host below.
      - name: Restore local tools (coverlet.console)
        run: dotnet tool restore

      # The library solution (Client + Models). Restored and built in Release so
      # the NuGet-packable Client project is validated the same way it ships.
      # Runs from the repo root, so the root global.json selects the .NET 9 SDK.
      - name: Restore library solution
        run: dotnet restore TheBleedingDeacons.Unity.Client.sln

      - name: Build library solution
        run: dotnet build TheBleedingDeacons.Unity.Client.sln --configuration Release --no-restore

      # Enforce formatting and the StyleCop / Meziantou analyzers (configured in
      # .editorconfig) for the library and the test project. Fails the build if
      # `dotnet format` would change anything. Run before the tests so a
      # formatting regression is reported up front. (The example is formatted in
      # its own step below, under the .NET 10 SDK.)
      - name: Verify formatting (dotnet format --verify-no-changes)
        run: |
          dotnet format TheBleedingDeacons.Unity.Client.sln --verify-no-changes
          dotnet format TheBleedingDeacons.Unity.Tests/TheBleedingDeacons.Unity.Tests.csproj --verify-no-changes

      # Debug build so coverlet instruments unoptimised assemblies with matching
      # PDBs. The test project references Client + Models, so this builds them too.
      - name: Build tests (Debug)
        run: dotnet build TheBleedingDeacons.Unity.Tests/TheBleedingDeacons.Unity.Tests.csproj --configuration Debug

      # xUnit v3 runs on Microsoft.Testing.Platform, so the test project is an
      # executable. coverlet.console instruments the library assemblies and runs
      # the test host, producing a Cobertura report. (coverlet's collector /
      # msbuild integrations hook VSTest, which MTP doesn't use — hence the tool.)
      # The root global.json keeps coverlet on the .NET 9 SDK so the assemblies it
      # instruments match the net9.0 runtime the test host loads them on.
      - name: Test with coverage
        run: >
          dotnet coverlet TheBleedingDeacons.Unity.Tests/bin/Debug/net9.0/TheBleedingDeacons.Unity.Tests.dll
          --target dotnet
          --targetargs "TheBleedingDeacons.Unity.Tests/bin/Debug/net9.0/TheBleedingDeacons.Unity.Tests.dll"
          --format cobertura
          --output coverage/coverage.cobertura.xml
          --include "[TheBleedingDeacons.Unity.Client]*"
          --include "[TheBleedingDeacons.Unity.Models]*"

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          # Public repo: the built-in GITHUB_TOKEN authenticates the upload,
          # so no separate Coveralls token/secret is required.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/coverage.cobertura.xml
          format: cobertura
          fail-on-error: false

      # The example CLI has its own solution and targets net10.0, so it is built
      # from the example/ directory where example/global.json selects the .NET 10
      # SDK (the repo root global.json would otherwise force .NET 9 here).
      - name: Verify example formatting
        working-directory: example
        run: dotnet format Integrity-cli/Integrity-cli.sln --verify-no-changes

      - name: Build example CLI
        working-directory: example
        run: dotnet build Integrity-cli/Integrity-cli.sln --configuration Release

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest

    # A job of its own, rather than a step inside the build as the PHP plugins
    # do it. There the scan is a step because it has to fail before
    # `composer install`; here the surrounding jobs install a JDK, the .NET SDK
    # and (in hand) the MAUI Android workload, none of which Semgrep needs. A
    # separate job runs in parallel and reports on its own terms.
    #
    # `semgrep ci` is diff-aware on a pull request, so it fails only on what
    # that PR introduces. Which findings are fatal is decided by the Block
    # remediation policy in Semgrep - currently Critical or High severity Code
    # findings - not by anything in this file.
    #
    # Note this repo's version bump is NOT gated on CI (version.yml has no
    # `needs:`), unlike the PHP plugins where `release: needs: ci`. So a red
    # Semgrep here fails the PR, but does not by itself stop a version being
    # cut once something is merged.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo 'SEMGREP_APP_TOKEN is not set - skipping the scan.'
            echo 'Set it as an organisation secret to enable this gate.'
            exit 0
          fi
          python3 -m pip install --quiet semgrep==1.174.0
          semgrep ci
